name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          # build.ps1 takes the version from "git describe --tags".
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.2

      - name: Lint
        run: ./build.ps1 lint

      - name: Test
        run: ./build.ps1 test

      - name: Build the release zip
        run: ./build.ps1 release-snapshot

      - name: Check the version in the binary
        run: |
          $tag = '${{ github.ref_name }}'
          $zip = "dist/ouroboros_${tag}_windows_amd64.zip"
          if (-not (Test-Path -LiteralPath $zip)) { throw "missing $zip; is the tag on the built commit?" }
          $got = & "dist/ouroboros_${tag}_windows_amd64/ouroboros.exe" version
          if ($got -ne "ouroboros $tag") { throw "binary reports '$got', expected 'ouroboros $tag'" }

      - name: Release notes from the changelog
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $notes = New-Object System.Collections.Generic.List[string]
          $in = $false
          foreach ($line in Get-Content CHANGELOG.md) {
            if ($line -match '^## \[') {
              if ($in) { break }
              $in = $line.StartsWith("## [$version]")
              continue
            }
            if ($in -and $line -notmatch '^\[.+\]: ') { $notes.Add($line) }
          }
          if ($notes.Count -eq 0) { throw "CHANGELOG.md has no section for $version" }
          ($notes -join "`n").Trim() | Set-Content -Encoding utf8 dist/notes.md

      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          gh release create $tag "dist/ouroboros_${tag}_windows_amd64.zip" dist/checksums.txt `
            --draft --verify-tag --title "Ouroboros $tag" --notes-file dist/notes.md
