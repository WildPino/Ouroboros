name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.2

      - name: Lint
        run: ./build.ps1 lint

      - name: Test
        run: ./build.ps1 test

      - name: Build
        run: ./build.ps1 build

      - uses: actions/upload-artifact@v4
        with:
          name: ouroboros
          path: |
            bin/ouroboros.exe
            bin/app/Ouroboros.exe
